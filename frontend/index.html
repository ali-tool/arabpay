<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArabPay - دفع لامركزي</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 40px;
            width: 420px;
            box-shadow: 0 0 40px rgba(99, 102, 241, 0.3);
        }
        h1 {
            text-align: center;
            color: #6366f1;
            margin-bottom: 10px;
            font-size: 2rem;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        .btn-connect {
            width: 100%;
            padding: 14px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        .btn-connect:hover { background: #4f46e5; }
        .wallet-info {
            background: #0f0f1a;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 0.8rem;
            color: #888;
            word-break: break-all;
            display: none;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #aaa;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #0f0f1a;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 16px;
        }
        input:focus { outline: none; border-color: #6366f1; }
        .btn-send {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-send:hover { opacity: 0.9; }
        .status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 0.9rem;
            display: none;
        }
        .status.success { background: #064e3b; color: #34d399; }
        .status.error { background: #7f1d1d; color: #f87171; }
    </style>
</head>
<body>
<div class="container">
    <h1>💸 ArabPay</h1>
    <p class="subtitle">دفع لامركزي بدون بنوك</p>

    <button class="btn-connect" onclick="connectWallet()">🔗 اتصل بالمحفظة</button>
    <div class="wallet-info" id="walletInfo"></div>

    <label>عنوان المستلم</label>
    <input type="text" id="toAddress" placeholder="0x..." />

    <label>المبلغ (tUSD8)</label>
    <input type="number" id="amount" placeholder="0.00" />

    <button class="btn-send" onclick="sendPayment()">إرسال الدفعة ✈️</button>

    <div class="status" id="status"></div>
</div>

<script>
    const CONTRACT_ADDRESS = "YOUR_CONTRACT_ADDRESS";
    const TOKEN_ADDRESS = "YOUR_TOKEN_ADDRESS";

    const CONTRACT_ABI = [
        "function sendPayment(address _to, uint256 _amount) external",
        "function getBalance(address _addr) external view returns (uint256)"
    ];

    const TOKEN_ABI = [
        "function approve(address spender, uint256 amount) external returns (bool)",
        "function balanceOf(address account) external view returns (uint256)"
    ];

    let signer;

    async function connectWallet() {
        if (!window.ethereum) {
            showStatus("MetaMask مو مثبت!", "error");
            return;
        }
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        const provider = new ethers.BrowserProvider(window.ethereum);
        signer = await provider.getSigner();
        document.getElementById("walletInfo").style.display = "block";
        document.getElementById("walletInfo").innerHTML = "✅ متصل: " + accounts[0];
    }

    async function sendPayment() {
        try {
            if (!signer) { showStatus("اتصل بالمحفظة أول!", "error"); return; }
            const to = document.getElementById("toAddress").value;
            const amount = document.getElementById("amount").value;
            const amountWei = ethers.parseUnits(amount, 18);

            const token = new ethers.Contract(TOKEN_ADDRESS, TOKEN_ABI, signer);
            await token.approve(CONTRACT_ADDRESS, amountWei);

            const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
            const tx = await contract.sendPayment(to, amountWei);
            await tx.wait();

            showStatus("✅ تم الإرسال بنجاح! TX: " + tx.hash, "success");
        } catch (err) {
            showStatus("❌ خطأ: " + err.message, "error");
        }
    }

    function showStatus(msg, type) {
        const s = document.getElementById("status");
        s.style.display = "block";
        s.className = "status " + type;
        s.innerHTML = msg;
    }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
</body>
</html>
